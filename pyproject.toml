[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae-pi-bin-client"
version = "0.1.0"
description = "Raspberry Pi daemon that subscribes to a Tesserae server over MQTT and paints 4-bpp .bin frames onto an Inky Impression."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Tesserae" }]
dependencies = [
    "paho-mqtt>=2.0,<3",
    # paint.py builds the (rows, cols) palette-index array that inky.show()
    # expects. inky already pulls numpy transitively; we list it explicitly
    # since we import it directly.
    "numpy>=1.24",
    # transports/rest.py uses requests for HTTP polling. inky already pulls
    # it transitively today, but list it explicitly so the dep tree doesn't
    # depend on inky's chain to satisfy a module we import directly.
    "requests>=2.31",
    # PINNED — paint.py knows the shape of inky's panel.buf and counts on
    # show() handling per-driver orientation + dual-controller plumbing.
    # Bumping this requires re-running --paint-test on real hardware.
    "inky[rpi]==2.4.0",
    # relay_crypto.py: X25519 + HKDF-SHA256 + AES-256-GCM for the cloud-relay
    # transport, pinned to docs/relay/contract.md's golden vectors.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tesserae-pi-bin-client = "tesserae_pi_bin_client.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
# Contract modules — strict.
module = [
    "tesserae_pi_bin_client.config",
    "tesserae_pi_bin_client.unpack",
    "tesserae_pi_bin_client.panels",
    "tesserae_pi_bin_client.heartbeat",
    "tesserae_pi_bin_client.mqtt_loop",
]
strict = true

[[tool.mypy.overrides]]
# Hardware-touching paths — defaults.
module = ["tesserae_pi_bin_client.paint", "tesserae_pi_bin_client.main"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Imported lazily and only on a Pi; none of them ship stubs.
module = ["paho.*", "inky.*", "gpiod.*", "gpiodevice.*", "smbus2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Contract modules added for firmware parity — strict, same as the rest.
module = [
    "tesserae_pi_bin_client.button_report",
    "tesserae_pi_bin_client.transports.sse",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
